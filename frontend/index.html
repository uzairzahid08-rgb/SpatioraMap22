<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpatioraMap</title>


    <!-- ==================================================
         LEAFLET
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- ==================================================
         LEAFLET GEOMAN
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background: #f8fafc;

            color: #172033;
        }


        #app {

            width: 100%;

            height: 100%;

            position: relative;
        }


        /* ==================================================
           SIDEBAR
        ================================================== */

        #sidebar {

            position: absolute;

            left: 0;

            top: 0;

            bottom: 0;

            width: 330px;

            min-width: 260px;

            max-width: 520px;

            background: #ffffff;

            border-right:
                1px solid #dce2ea;

            z-index: 1000;

            display: flex;

            flex-direction: column;

            box-shadow:
                2px 0 10px
                rgba(15, 23, 42, 0.08);
        }


        #resizeHandle {

            position: absolute;

            top: 0;

            right: -4px;

            width: 8px;

            height: 100%;

            cursor: col-resize;

            z-index: 2000;
        }


        #resizeHandle:hover {

            background:
                rgba(59, 130, 246, 0.15);
        }


        /* ==================================================
           BRAND
        ================================================== */

        .brand {

            padding:
                18px
                18px
                15px
                18px;

            border-bottom:
                1px solid #e5e9ef;
        }


        .brand-title {

            font-size: 21px;

            font-weight: 700;

            color: #172033;

            letter-spacing: -0.3px;
        }


        .brand-subtitle {

            margin-top: 3px;

            font-size: 11px;

            color: #718096;
        }


        /* ==================================================
           DASHBOARD
        ================================================== */

        .dashboard {

            padding: 12px;

            border-bottom:
                1px solid #e5e9ef;
        }


        .dashboard-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 8px;
        }


        .stat-card {

            border:
                1px solid #e0e6ee;

            border-radius: 8px;

            padding: 10px;

            background: #fbfcfe;
        }


        .stat-label {

            font-size: 10px;

            color: #718096;

            margin-bottom: 4px;
        }


        .stat-value {

            font-size: 19px;

            font-weight: 700;

            color: #172033;
        }


        /* ==================================================
           FEATURES
        ================================================== */

        .features-section {

            flex: 1;

            min-height: 0;

            display: flex;

            flex-direction: column;
        }


        .section-header {

            padding:
                13px
                12px
                9px
                12px;

            font-size: 13px;

            font-weight: 700;

            color: #263449;
        }


        .filters {

            padding:
                0
                12px
                10px
                12px;
        }


        .search-input,
        .filter-select {

            width: 100%;

            height: 34px;

            border:
                1px solid #d7dee8;

            border-radius: 6px;

            background: #ffffff;

            color: #273449;

            padding: 0 9px;

            font-size: 12px;

            outline: none;
        }


        .search-input:focus,
        .filter-select:focus {

            border-color: #8ca7c7;

            box-shadow:
                0 0 0 2px
                rgba(76, 110, 160, 0.08);
        }


        .filter-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 7px;

            margin-top: 7px;
        }


        #featureList {

            flex: 1;

            overflow-y: auto;

            padding:
                0
                8px
                10px
                8px;
        }


        .feature-item {

            border:
                1px solid #e1e6ed;

            border-radius: 7px;

            padding: 9px;

            margin-bottom: 7px;

            background: #ffffff;

            cursor: pointer;

            transition: 0.15s ease;
        }


        .feature-item:hover {

            background: #f8fafc;

            border-color: #c8d2df;
        }


        .feature-name {

            font-size: 12px;

            font-weight: 700;

            color: #1f2c40;
        }


        .feature-meta {

            font-size: 10px;

            color: #718096;

            margin-top: 3px;
        }


        .feature-actions {

            display: flex;

            gap: 5px;

            margin-top: 8px;
        }


        .small-btn {

            flex: 1;

            height: 28px;

            border:
                1px solid #d7dee8;

            border-radius: 5px;

            background: #ffffff;

            color: #344054;

            font-size: 10px;

            cursor: pointer;
        }


        .small-btn:hover {

            background: #f1f5f9;
        }


        .small-btn.delete:hover {

            background: #fff4f4;

            border-color: #e7b7b7;

            color: #b42318;
        }


        .empty-state {

            text-align: center;

            color: #8a94a6;

            font-size: 11px;

            padding: 25px 12px;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .sidebar-footer {

            border-top:
                1px solid #e5e9ef;

            padding: 10px;
        }


        .download-btn {

            width: 100%;

            height: 37px;

            border:
                1px solid #cbd5e1;

            border-radius: 6px;

            background: #172033;

            color: #ffffff;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        .download-btn:hover {

            background: #263449;
        }


        .download-btn:disabled {

            opacity: 0.65;

            cursor: wait;
        }


        /* ==================================================
           MAP
        ================================================== */

        #map {

            position: absolute;

            top: 0;

            right: 0;

            bottom: 0;

            left: 330px;

            z-index: 1;
        }


        /* ==================================================
           DIGITIZING TOOLBAR
        ================================================== */

        .leaflet-pm-toolbar {

            background: #ffffff !important;

            border:
                1px solid #d8dee8 !important;

            border-radius: 9px !important;

            padding: 6px !important;

            box-shadow:
                0 4px 14px
                rgba(15, 23, 42, 0.16) !important;

            overflow: visible !important;

            width: 46px !important;

            min-width: 46px !important;

            transform: none !important;
        }


        .leaflet-pm-toolbar
        .button-container {

            margin: 0 !important;

            padding: 0 !important;

            background: transparent !important;

            border: none !important;

            box-shadow: none !important;

            width: 100% !important;
        }


        .leaflet-pm-toolbar
        .button-container a {

            display: flex !important;

            align-items: center !important;

            justify-content: center !important;

            width: 34px !important;

            height: 34px !important;

            margin:
                0
                auto
                6px
                auto !important;

            padding: 0 !important;

            background: #ffffff !important;

            border:
                1px solid #d5dbe4 !important;

            border-radius: 6px !important;

            box-shadow:
                0 1px 3px
                rgba(15, 23, 42, 0.12) !important;

            text-decoration: none !important;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease !important;
        }


        .leaflet-pm-toolbar
        .button-container:last-child a {

            margin-bottom: 0 !important;
        }


        .leaflet-pm-toolbar
        .button-container a:hover {

            background: #f1f5f9 !important;

            border-color: #aebdce !important;

            box-shadow:
                0 2px 6px
                rgba(15, 23, 42, 0.18) !important;
        }


        .leaflet-pm-toolbar
        .button-container a.active {

            background: #e7eef7 !important;

            border-color: #7f9bbd !important;
        }


        .leaflet-pm-toolbar
        .control-icon {

            width: 32px !important;

            height: 32px !important;

            display: block !important;

            background-color:
                transparent !important;

            background-repeat:
                no-repeat !important;

            background-position:
                center !important;

            background-size:
                20px 20px !important;

            border: none !important;

            box-shadow: none !important;
        }


        .leaflet-pm-toolbar
        .button-container
        a[class*="leaflet-pm-icon"] {

            background-color:
                #ffffff !important;
        }


        /* ==================================================
           MODAL
        ================================================== */

        .modal-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15, 23, 42, 0.42);

            z-index: 5000;

            align-items: center;

            justify-content: center;
        }


        .modal-overlay.show {

            display: flex;
        }


        .modal {

            width: 420px;

            max-width:
                calc(100vw - 30px);

            background: #ffffff;

            border-radius: 10px;

            box-shadow:
                0 18px 50px
                rgba(15, 23, 42, 0.25);

            overflow: hidden;
        }


        .modal-header {

            padding:
                15px
                17px;

            border-bottom:
                1px solid #e5e9ef;

            display: flex;

            align-items: center;

            justify-content:
                space-between;
        }


        .modal-title {

            font-size: 15px;

            font-weight: 700;

            color: #172033;
        }


        .modal-close {

            border: none;

            background: transparent;

            font-size: 21px;

            color: #667085;

            cursor: pointer;
        }


        .modal-body {

            padding: 16px;
        }


        .form-group {

            margin-bottom: 12px;
        }


        .form-label {

            display: block;

            font-size: 11px;

            font-weight: 600;

            color: #344054;

            margin-bottom: 5px;
        }


        .form-input,
        .form-select,
        .form-textarea {

            width: 100%;

            border:
                1px solid #d7dee8;

            border-radius: 6px;

            background: #ffffff;

            padding: 9px;

            font-size: 12px;

            color: #172033;

            outline: none;
        }


        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {

            border-color: #8ca7c7;

            box-shadow:
                0 0 0 2px
                rgba(76, 110, 160, 0.08);
        }


        .form-textarea {

            min-height: 80px;

            resize: vertical;
        }


        .geometry-display {

            background: #f5f7fa;

            border:
                1px solid #e1e6ed;

            border-radius: 6px;

            padding: 9px;

            font-size: 11px;

            color: #667085;
        }


        .modal-footer {

            padding:
                12px
                16px;

            border-top:
                1px solid #e5e9ef;

            display: flex;

            justify-content: flex-end;

            gap: 7px;
        }


        .modal-btn {

            height: 34px;

            padding:
                0
                14px;

            border-radius: 6px;

            border:
                1px solid #d7dee8;

            background: #ffffff;

            color: #344054;

            font-size: 12px;

            cursor: pointer;
        }


        .modal-btn.primary {

            background: #172033;

            color: #ffffff;

            border-color: #172033;
        }


        .modal-btn.primary:hover {

            background: #263449;
        }


        /* ==================================================
           TOAST
        ================================================== */

        #toast {

            position: fixed;

            left: 50%;

            bottom: 25px;

            transform:
                translateX(-50%);

            background: #172033;

            color: #ffffff;

            padding:
                9px
                15px;

            border-radius: 6px;

            font-size: 11px;

            z-index: 6000;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.2s ease;
        }


        #toast.show {

            opacity: 1;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 700px) {

            #sidebar {

                width: 285px;

                min-width: 240px;
            }


            #map {

                left: 285px;
            }


            .brand-title {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- ==================================================
         SIDEBAR
    ================================================== -->

    <aside id="sidebar">


        <div class="brand">

            <div class="brand-title">
                SpatioraMap
            </div>


            <div class="brand-subtitle">
                Lightweight Web GIS Digitizing Platform
            </div>

        </div>


        <!-- ==================================================
             DASHBOARD
        ================================================== -->

        <div class="dashboard">

            <div class="dashboard-grid">


                <div class="stat-card">

                    <div class="stat-label">
                        Total Features
                    </div>


                    <div
                        class="stat-value"
                        id="totalCount"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Points
                    </div>


                    <div
                        class="stat-value"
                        id="pointCount"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Lines
                    </div>


                    <div
                        class="stat-value"
                        id="lineCount"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Polygons
                    </div>


                    <div
                        class="stat-value"
                        id="polygonCount"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Active
                    </div>


                    <div
                        class="stat-value"
                        id="activeCount"
                    >
                        0
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Inactive
                    </div>


                    <div
                        class="stat-value"
                        id="inactiveCount"
                    >
                        0
                    </div>

                </div>

            </div>

        </div>


        <!-- ==================================================
             FEATURES
        ================================================== -->

        <div class="features-section">


            <div class="section-header">
                My Features
            </div>


            <div class="filters">


                <input
                    id="searchInput"
                    class="search-input"
                    type="text"
                    placeholder="Search features..."
                >


                <div class="filter-row">


                    <select
                        id="geometryFilter"
                        class="filter-select"
                    >

                        <option value="All">
                            All Geometry Types
                        </option>


                        <option value="Point">
                            Points
                        </option>


                        <option value="LineString">
                            Lines
                        </option>


                        <option value="Polygon">
                            Polygons
                        </option>

                    </select>


                    <select
                        id="statusFilter"
                        class="filter-select"
                    >

                        <option value="All">
                            All Status
                        </option>


                        <option value="Active">
                            Active
                        </option>


                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>

            </div>


            <div id="featureList"></div>

        </div>


        <!-- ==================================================
             FOOTER
        ================================================== -->

        <div class="sidebar-footer">


            <button
                id="downloadButton"
                class="download-btn"
                onclick="downloadData()"
            >
                ⬇ Download SHP + Attributes
            </button>

        </div>


        <div id="resizeHandle"></div>

    </aside>


    <!-- ==================================================
         MAP
    ================================================== -->

    <main id="map"></main>

</div>


<!-- ======================================================
     ATTRIBUTE MODAL
====================================================== -->

<div
    id="attributeModal"
    class="modal-overlay"
>


    <div class="modal">


        <div class="modal-header">


            <div
                id="modalTitle"
                class="modal-title"
            >
                Feature Attributes
            </div>


            <button
                class="modal-close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div class="modal-body">


            <div class="form-group">


                <label class="form-label">
                    Geometry Type
                </label>


                <div
                    id="geometryTypeDisplay"
                    class="geometry-display"
                >
                    Point
                </div>

            </div>


            <div class="form-group">


                <label
                    class="form-label"
                    for="featureName"
                >
                    Name
                </label>


                <input
                    id="featureName"
                    class="form-input"
                    type="text"
                    placeholder="Enter feature name"
                >

            </div>


            <div class="form-group">


                <label
                    class="form-label"
                    for="assetType"
                >
                    Type
                </label>


                <input
                    id="assetType"
                    class="form-input"
                    type="text"
                    placeholder="e.g. Building, Road, River"
                >

            </div>


            <div class="form-group">


                <label
                    class="form-label"
                    for="description"
                >
                    Description
                </label>


                <textarea
                    id="description"
                    class="form-textarea"
                    placeholder="Optional description"
                ></textarea>

            </div>


            <div class="form-group">


                <label
                    class="form-label"
                    for="status"
                >
                    Status
                </label>


                <select
                    id="status"
                    class="form-select"
                >

                    <option value="Active">
                        Active
                    </option>


                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <div class="modal-footer">


            <button
                class="modal-btn"
                onclick="cancelDrawing()"
            >
                Cancel
            </button>


            <button
                class="modal-btn primary"
                onclick="saveFeature()"
            >
                Save Feature
            </button>

        </div>

    </div>

</div>


<div id="toast"></div>


<!-- ======================================================
     LIBRARIES
====================================================== -->


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script
    src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js">
</script>


<script
    src="https://unpkg.com/shp-write@0.3.2/shpwrite.js">
</script>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
</script>


<script>


    /* ======================================================
       MAP
    ====================================================== */

    const map =
        L.map(
            "map",
            {

                center: [
                    34.0151,
                    71.5249
                ],

                zoom: 11,

                zoomControl: true

            }
        );


    /* ======================================================
       BASEMAPS
    ====================================================== */

    const osm =
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 20,

                attribution:
                    "&copy; OpenStreetMap contributors"

            }
        );


    const satellite =
        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {

                maxZoom: 20,

                attribution:
                    "Tiles &copy; Esri"

            }
        );


    osm.addTo(map);


    L.control.layers(
        {

            "OpenStreetMap": osm,

            "Satellite": satellite

        },
        null,
        {

            position:
                "topright"

        }
    ).addTo(map);


    /* ======================================================
       GEOMAN
    ====================================================== */

    map.pm.addControls(
        {

            position:
                "topleft",

            drawMarker:
                true,

            drawPolyline:
                true,

            drawPolygon:
                true,

            drawCircle:
                false,

            drawCircleMarker:
                false,

            drawRectangle:
                false,

            drawText:
                false,

            editMode:
                false,

            dragMode:
                false,

            cutPolygon:
                false,

            removalMode:
                false

        }
    );


    /* ======================================================
       LOCAL USER STORAGE
    ====================================================== */

    const STORAGE_KEY =
        "spatioramap_user_features_v2";


    let userFeatures = [];


    let currentDrawingLayer =
        null;


    let editingFeatureId =
        null;


    let editingLayer =
        null;


    let savedLayers = {};


    /* ======================================================
       LOAD LOCAL DATA
    ====================================================== */

    function loadLocalData() {

        try {

            const stored =
                localStorage.getItem(
                    STORAGE_KEY
                );


            if (!stored) {

                userFeatures = [];

                return;
            }


            const parsed =
                JSON.parse(
                    stored
                );


            if (
                Array.isArray(parsed)
            ) {

                userFeatures =
                    parsed;

            } else {

                userFeatures = [];

            }

        } catch (error) {

            console.error(
                "Local storage error:",
                error
            );

            userFeatures = [];

        }

    }


    /* ======================================================
       SAVE LOCAL DATA
    ====================================================== */

    function saveLocalData() {

        try {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(
                    userFeatures
                )
            );

            return true;

        } catch (error) {

            console.error(
                "Unable to save local data:",
                error
            );

            showToast(
                "Browser storage is full."
            );

            return false;
        }

    }


    /* ======================================================
       CLEAR MAP FEATURES
    ====================================================== */

    function clearSavedLayers() {

        Object.values(
            savedLayers
        ).forEach(
            layer => {

                try {

                    map.removeLayer(
                        layer
                    );

                } catch (error) {}

            }
        );


        savedLayers = {};

    }


    /* ======================================================
       RENDER FEATURES
    ====================================================== */

    function renderFeatures() {

        clearSavedLayers();


        userFeatures.forEach(
            feature => {

                const geojson = {

                    type:
                        "Feature",

                    geometry:
                        feature.geometry,

                    properties: {

                        id:
                            feature.id,

                        name:
                            feature.name,

                        asset_type:
                            feature.asset_type,

                        description:
                            feature.description,

                        status:
                            feature.status

                    }

                };


                const layer =
                    L.geoJSON(
                        geojson,
                        {

                            pointToLayer:
                                function(
                                    feature,
                                    latlng
                                ) {

                                    return L.circleMarker(
                                        latlng,
                                        {

                                            radius:
                                                7,

                                            weight:
                                                2,

                                            fillOpacity:
                                                0.85

                                        }
                                    );

                                },


                            onEachFeature:
                                function(
                                    feature,
                                    layer
                                ) {

                                    const p =
                                        feature.properties;


                                    layer.bindPopup(
                                        `

                                        <div
                                            style="min-width:180px"
                                        >

                                            <strong>
                                                ${escapeHtml(
                                                    p.name
                                                )}
                                            </strong>

                                            <br>

                                            <span>
                                                Type:
                                                ${escapeHtml(
                                                    p.asset_type ||
                                                    "-"
                                                )}
                                            </span>

                                            <br>

                                            <span>
                                                Geometry:
                                                ${escapeHtml(
                                                    feature.geometry.type
                                                )}
                                            </span>

                                            <br>

                                            <span>
                                                Status:
                                                ${escapeHtml(
                                                    p.status
                                                )}
                                            </span>

                                            ${
                                                p.description
                                                ?
                                                `

                                                <br>

                                                <span>
                                                    ${escapeHtml(
                                                        p.description
                                                    )}
                                                </span>

                                                `
                                                :
                                                ""
                                            }

                                        </div>

                                        `
                                    );


                                    layer.on(
                                        "click",
                                        function() {

                                            if (
                                                feature.geometry.type ===
                                                "Point"
                                            ) {

                                                map.setView(
                                                    layer.getLatLng(),
                                                    17
                                                );

                                            } else {

                                                map.fitBounds(
                                                    layer.getBounds(),
                                                    {

                                                        padding:
                                                            [30, 30]

                                                    }
                                                );

                                            }

                                        }
                                    );

                                }

                        }
                    ).addTo(map);


                savedLayers[
                    feature.id
                ] = layer;

            }
        );


        updateDashboard();

        applyFilters();

    }


    /* ======================================================
       DRAW CREATED
    ====================================================== */

    map.on(
        "pm:create",
        function(event) {

            currentDrawingLayer =
                event.layer;


            const geometry =
                layerToGeoJSON(
                    currentDrawingLayer
                );


            if (!geometry) {

                map.removeLayer(
                    currentDrawingLayer
                );

                currentDrawingLayer =
                    null;

                return;
            }


            editingFeatureId =
                null;


            editingLayer =
                null;


            openAttributeModal(
                geometry.type
            );

        }
    );


    /* ======================================================
       LAYER TO GEOJSON
    ====================================================== */

    function layerToGeoJSON(
        layer
    ) {

        if (!layer) {

            return null;

        }


        try {

            const geojson =
                layer.toGeoJSON();


            return geojson.geometry;

        } catch (error) {

            console.error(
                "Geometry conversion error:",
                error
            );

            return null;

        }

    }

       CLOSE MODAL
    ====================================================== */

    function closeModal() {

            .getElementById(
                "attributeModal"
            )
            .classList.remove(
                "show"
            );

    /* ======================================================
       CANCEL
    ====================================================== */

    function cancelDrawing() {

        if (
            currentDrawingLayer &&
            editingFeatureId === null
        ) {

            map.removeLayer(
                currentDrawingLayer
            );

        }


        currentDrawingLayer =
            null;


        editingFeatureId =
            null;


        editingLayer =
            null;


        disableEditMode();

        closeModal();

    }


    /* ======================================================
       SAVE FEATURE
    ====================================================== */

    function saveFeature() {

        const name =
            document
                .getElementById(
                    "featureName"
                )
                .value
                .trim();


        const assetType =
            document
                .getElementById(
                    "assetType"
                )
                .value
                .trim();


        const description =
            document
                .getElementById(
                    "description"
                )
                .value
                .trim();


        const status =
            document
                .getElementById(
                    "status"
                )
                .value;


        if (!name) {

            showToast(
                "Feature name is required."
            );

            return;

        }


        /* ==================================================
           UPDATE
        ================================================== */

        if (
            editingFeatureId !== null
        ) {

            const feature =
                userFeatures.find(
                    item =>
                        item.id ===
                        editingFeatureId
                );


            if (!feature) {

                showToast(
                    "Feature not found."
                );

                closeModal();

                return;

            }


            let geometry =
                feature.geometry;


            if (editingLayer) {

                const updatedGeometry =
                    layerToGeoJSON(
                        editingLayer
                    );


                if (updatedGeometry) {

                    geometry =
                        updatedGeometry;

                }

            }


            feature.geometry =
                geometry;


            feature.geometry_type =
                geometry.type;


            feature.name =
                name;


            feature.asset_type =
                assetType;


            feature.description =
                description;


            feature.status =
                status;


            saveLocalData();

            disableEditMode();

            renderFeatures();

            closeModal();


            currentDrawingLayer =
                null;


            editingFeatureId =
                null;


            editingLayer =
                null;


            showToast(
                "Feature updated successfully."
            );


            return;

        }


        /* ==================================================
           NEW FEATURE
        ================================================== */

        if (!currentDrawingLayer) {

            showToast(
                "No geometry found."
            );

            return;

        }


        const geometry =
            layerToGeoJSON(
                currentDrawingLayer
            );


        if (!geometry) {

            showToast(
                "Invalid geometry."
            );

            return;

        }


        const feature = {

            id:
                Date.now().toString() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8),


            geometry_type:
                geometry.type,


            geometry:
                geometry,


            name:
                name,


            asset_type:
                assetType,


            description:
                description,


            status:
                status,


            created_at:
                new Date().toISOString()

        };


        userFeatures.unshift(
            feature
        );


        saveLocalData();

        renderFeatures();

        closeModal();


        currentDrawingLayer =
            null;


        showToast(
            "Feature saved locally."
        );

    }


    /* ======================================================
       EDIT FEATURE
    ====================================================== */

    function editFeature(id) {

        const feature =
            userFeatures.find(
                item =>
                    item.id === id
            );


        if (!feature) {

            return;

        }


        const layer =
            savedLayers[id];


        if (!layer) {

            return;

        }


        let editableLayer =
            null;


        if (
            feature.geometry_type ===
            "Point"
        ) {

            editableLayer =
                layer;

        } else {

            const layers = [];


            layer.eachLayer(
                item => {

                    layers.push(
                        item
                    );

                }
            );


            editableLayer =
                layers[0] ||
                null;

        }


        if (!editableLayer) {

            showToast(
                "Unable to edit feature."
            );

            return;

        }


        editingFeatureId =
            id;


        editingLayer =
            editableLayer;


        currentDrawingLayer =
            null;


        closeAllPopups();


        map.pm.enableGlobalEditMode();


        openAttributeModal(
            feature.geometry_type,
            feature
        );

    }


    /* ======================================================
       DISABLE EDIT MODE
    ====================================================== */

    function disableEditMode() {

        try {

            map.pm.disableGlobalEditMode();

        } catch (error) {}

    }


    /* ======================================================
       DELETE FEATURE
    ====================================================== */

    function deleteFeature(id) {

        const feature =
            userFeatures.find(
                item =>
                    item.id === id
            );


        if (!feature) {

            return;

        }


        const confirmed =
            confirm(
                `Delete "${feature.name}"?`
            );


        if (!confirmed) {

            return;

        }


        userFeatures =
            userFeatures.filter(
                item =>
                    item.id !== id
            );


        saveLocalData();

        renderFeatures();


        showToast(
            "Feature deleted."
        );

    }


    /* ======================================================
       FEATURE LIST
    ====================================================== */

    function renderFeatureList(
        features
    ) {

        const container =
            document.getElementById(
                "featureList"
            );


        container.innerHTML =
            "";


        if (!features.length) {

            container.innerHTML =
                `

                <div class="empty-state">
                    No features found.
                </div>

                `;

            return;

        }


        features.forEach(
            feature => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "feature-item";


                item.innerHTML =
                    `

                    <div class="feature-name">

                        ${escapeHtml(
                            feature.name
                        )}

                    </div>


                    <div class="feature-meta">

                        ${escapeHtml(
                            feature.asset_type ||
                            "No type"
                        )}

                        ·

                        ${escapeHtml(
                            feature.geometry_type
                        )}

                        ·

                        ${escapeHtml(
                            feature.status
                        )}

                    </div>


                    ${
                        feature.description
                        ?
                        `

                        <div class="feature-meta">

                            ${escapeHtml(
                                feature.description
                            )}

                        </div>

                        `
                        :
                        ""
                    }


                    <div class="feature-actions">


                        <button
                            class="small-btn"
                            onclick="
                                event.stopPropagation();
                                zoomToFeature('${feature.id}')
                            "
                        >
                            Zoom
                        </button>


                        <button
                            class="small-btn"
                            onclick="
                                event.stopPropagation();
                                editFeature('${feature.id}')
                            "
                        >
                            Edit
                        </button>


                        <button
                            class="small-btn delete"
                            onclick="
                                event.stopPropagation();
                                deleteFeature('${feature.id}')
                            "
                        >
                            Delete
                        </button>

                    </div>

                    `;


                item.addEventListener(
                    "click",
                    function() {

                        zoomToFeature(
                            feature.id
                        );

                    }
                );


                container.appendChild(
                    item
                );

            }
        );

    }


    /* ======================================================
       ZOOM
    ====================================================== */

    function zoomToFeature(id) {

        const layer =
            savedLayers[id];


        if (!layer) {

            return;

        }


        try {

            if (
                layer.getBounds &&
                layer.getBounds().isValid()
            ) {

                map.fitBounds(
                    layer.getBounds(),
                    {

                        padding:
                            [40, 40]

                    }
                );

            } else if (
                layer.getLatLng
            ) {

                map.setView(
                    layer.getLatLng(),
                    17
                );

            }

        } catch (error) {

            console.error(
                error
            );

        }


        try {

            layer.openPopup();

        } catch (error) {}

    }


    /* ======================================================
       FILTERS
    ====================================================== */

    function applyFilters() {

        const search =
            document
                .getElementById(
                    "searchInput"
                )
                .value
                .trim()
                .toLowerCase();


        const geometry =
            document
                .getElementById(
                    "geometryFilter"
                )
                .value;


        const status =
            document
                .getElementById(
                    "statusFilter"
                )
                .value;


        const filtered =
            userFeatures.filter(
                feature => {

                    const searchText =
                        [

                            feature.name,

                            feature.asset_type,

                            feature.description,

                            feature.geometry_type,

                            feature.status

                        ]
                        .join(" ")
                        .toLowerCase();


                    const matchesSearch =
                        !search ||
                        searchText.includes(
                            search
                        );


                    const matchesGeometry =
                        geometry === "All" ||
                        feature.geometry_type ===
                        geometry;


                    const matchesStatus =
                        status === "All" ||
                        feature.status ===
                        status;


                    return (
                        matchesSearch &&
                        matchesGeometry &&
                        matchesStatus
                    );

                }
            );


        renderFeatureList(
            filtered
        );

    }


    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "input",
            applyFilters
        );


    document
        .getElementById(
            "geometryFilter"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById(
            "statusFilter"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    /* ======================================================
       DASHBOARD
    ====================================================== */

    function updateDashboard() {

        let points =
            0;


        let lines =
            0;


        let polygons =
            0;


        let active =
            0;


        let inactive =
            0;


        userFeatures.forEach(
            feature => {

                if (
                    feature.geometry_type ===
                    "Point"
                ) {

                    points++;

                }

                else if (
                    feature.geometry_type ===
                    "LineString"
                ) {

                    lines++;

                }

                else if (
                    feature.geometry_type ===
                    "Polygon"
                ) {

                    polygons++;

                }


                if (
                    feature.status ===
                    "Active"
                ) {

                    active++;

                }

                else if (
                    feature.status ===
                    "Inactive"
                ) {

                    inactive++;

                }

            }
        );


        document
            .getElementById(
                "totalCount"
            )
            .textContent =
            userFeatures.length;


        document
            .getElementById(
                "pointCount"
            )
            .textContent =
            points;


        document
            .getElementById(
                "lineCount"
            )
            .textContent =
            lines;


        document
            .getElementById(
                "polygonCount"
            )
            .textContent =
            polygons;


        document
            .getElementById(
                "activeCount"
            )
            .textContent =
            active;


        document
            .getElementById(
                "inactiveCount"
            )
            .textContent =
            inactive;

    }


    /* ======================================================
       DOWNLOAD
       ------------------------------------------------------
       Browser-local export.
       No feature data is sent to FastAPI.
    ====================================================== */

    async function downloadData() {

        if (
            !userFeatures.length
        ) {

            showToast(
                "There are no features to download."
            );

            return;
        }


        const button =
            document.getElementById(
                "downloadButton"
            );


        const originalText =
            button.textContent;


        button.disabled =
            true;


        button.textContent =
            "Preparing download...";


        try {


            /* ==============================================
               CHECK REQUIRED LIBRARIES
            ============================================== */

            if (
                typeof shpwrite ===
                "undefined"
            ) {

                throw new Error(
                    "shp-write library is not available."
                );

            }


            if (
                typeof JSZip ===
                "undefined"
            ) {

                throw new Error(
                    "JSZip library is not available."
                );

            }


            /* ==============================================
               TIMESTAMP
            ============================================== */

            const timestamp =
                new Date()
                    .toISOString()
                    .replace(
                        /[:.]/g,
                        "-"
                    );


            /* ==============================================
               FEATURE COLLECTIONS
            ============================================== */

            const pointFeatures =
                [];


            const lineFeatures =
                [];


            const polygonFeatures =
                [];


            userFeatures.forEach(
                feature => {

                    if (
                        !feature.geometry
                    ) {

                        return;

                    }


                    const geojsonFeature = {

                        type:
                            "Feature",

                        geometry:
                            feature.geometry,

                        properties: {

                            ID:
                                String(
                                    feature.id ??
                                    ""
                                ),

                            NAME:
                                String(
                                    feature.name ??
                                    ""
                                ),

                            TYPE:
                                String(
                                    feature.asset_type ??
                                    ""
                                ),

                            DESCRIPTION:
                                String(
                                    feature.description ??
                                    ""
                                ),

                            STATUS:
                                String(
                                    feature.status ??
                                    ""
                                ),

                            CREATED:
                                String(
                                    feature.created_at ??
                                    ""
                                )

                        }

                    };


                    if (
                        feature.geometry_type ===
                        "Point"
                    ) {

                        pointFeatures.push(
                            geojsonFeature
                        );

                    }


                    else if (
                        feature.geometry_type ===
                        "LineString"
                    ) {

                        lineFeatures.push(
                            geojsonFeature
                        );

                    }


                    else if (
                        feature.geometry_type ===
                        "Polygon"
                    ) {

                        polygonFeatures.push(
                            geojsonFeature
                        );

                    }

                }
            );


            /* ==============================================
               FINAL ZIP
            ============================================== */

            const finalZip =
                new JSZip();


            /* ==============================================
               POINTS
            ============================================== */

            if (
                pointFeatures.length > 0
            ) {

                const pointCollection = {

                    type:
                        "FeatureCollection",

                    features:
                        pointFeatures

                };


                const pointZip =
                    shpwrite.zip(
                        pointCollection,
                        {

                            folder:
                                "points",

                            types: {

                                point:
                                    "points"

                            }

                        }
                    );


                await addGeneratedZipFiles(
                    finalZip,
                    pointZip,
                    "points"
                );

            }


            /* ==============================================
               LINES
            ============================================== */

            if (
                lineFeatures.length > 0
            ) {

                const lineCollection = {

                    type:
                        "FeatureCollection",

                    features:
                        lineFeatures

                };


                const lineZip =
                    shpwrite.zip(
                        lineCollection,
                        {

                            folder:
                                "lines",

                            types: {

                                line:
                                    "lines"

                            }

                        }
                    );


                await addGeneratedZipFiles(
                    finalZip,
                    lineZip,
                    "lines"
                );

            }


            /* ==============================================
               POLYGONS
            ============================================== */

            if (
                polygonFeatures.length > 0
            ) {

                const polygonCollection = {

                    type:
                        "FeatureCollection",

                    features:
                        polygonFeatures

                };


                const polygonZip =
                    shpwrite.zip(
                        polygonCollection,
                        {

                            folder:
                                "polygons",

                            types: {

                                polygon:
                                    "polygons"

                            }

                        }
                    );


                await addGeneratedZipFiles(
                    finalZip,
                    polygonZip,
                    "polygons"
                );

            }


            /* ==============================================
               CSV
            ============================================== */

            const csv =
                createCSV(
                    userFeatures
                );


            finalZip.file(
                "all_attributes.csv",
                csv
            );


            /* ==============================================
               GENERATE ZIP
            ============================================== */

            const blob =
                await finalZip.generateAsync(
                    {

                        type:
                            "blob",

                        compression:
                            "DEFLATE",

                        compressionOptions: {

                            level:
                                6

                        }

                    }
                );


            if (!blob || blob.size === 0) {

                throw new Error(
                    "Generated ZIP is empty."
                );

            }


            /* ==============================================
               DOWNLOAD FILE
            ============================================== */

            const url =
                URL.createObjectURL(
                    blob
                );


            const anchor =
                document.createElement(
                    "a"
                );


            anchor.href =
                url;


            anchor.download =
                `SpatioraMap_Export_${timestamp}.zip`;


            anchor.style.display =
                "none";


            document
                .body
                .appendChild(
                    anchor
                );


            anchor.click();


            document
                .body
                .removeChild(
                    anchor
                );


            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                3000
            );


            showToast(
                "Download completed successfully."
            );


        } catch (error) {

            console.error(
                "Download error:",
                error
            );


            showToast(
                "Download failed. Please try again."
            );


        } finally {

            button.disabled =
                false;


            button.textContent =
                originalText;

        }

    }


    /* ======================================================
       ADD GENERATED SHP ZIP FILES
    ====================================================== */

    async function addGeneratedZipFiles(
        destinationZip,
        generatedZip,
        folderName
    ) {

        let sourceZip;


        /* ==============================================
           HANDLE BLOB
        ============================================== */

        if (
            generatedZip instanceof Blob
        ) {

            sourceZip =
                await JSZip.loadAsync(
                    generatedZip
                );

        }


        /* ==============================================
           HANDLE ARRAYBUFFER / UINT8ARRAY
        ============================================== */

        else {

            sourceZip =
                await JSZip.loadAsync(
                    generatedZip
                );

        }


        const entries =
            Object.keys(
                sourceZip.files
            );


        for (
            const entryName
            of entries
        ) {

            const entry =
                sourceZip.files[
                    entryName
                ];


            if (
                entry.dir
            ) {

                continue;

            }


            const content =
                await entry.async(
                    "uint8array"
                );


            const cleanName =
                entryName
                    .split("/")
                    .pop();


            if (!cleanName) {

                continue;

            }


            destinationZip.file(
                `${folderName}/${cleanName}`,
                content
            );

        }

    }


    /* ======================================================
       CSV
    ====================================================== */

    function createCSV(
        features
    ) {

        const headers = [

            "id",

            "name",

            "asset_type",

            "description",

            "status",

            "geometry_type",

            "created_at"

        ];


        const rows = [

            headers.join(",")

        ];


        features.forEach(
            feature => {

                const row = [

                    csvEscape(
                        feature.id
                    ),

                    csvEscape(
                        feature.name
                    ),

                    csvEscape(
                        feature.asset_type
                    ),

                    csvEscape(
                        feature.description
                    ),

                    csvEscape(
                        feature.status
                    ),

                    csvEscape(
                        feature.geometry_type
                    ),

                    csvEscape(
                        feature.created_at
                    )

                ];


                rows.push(
                    row.join(",")
                );

            }
        );


        return rows.join(
            "\r\n"
        );

    }


    function csvEscape(
        value
    ) {

        const text =
            String(
                value ?? ""
            );


        return `"${text.replace(
            /"/g,
            '""'
        )}"`;

    }

       HTML ESCAPE
    ====================================================== */

    function escapeHtml(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value ?? "";


        return div.innerHTML;

    }


    /* ======================================================
       SIDEBAR RESIZE
    ====================================================== */

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    const resizeHandle =
        document.getElementById(
            "resizeHandle"
        );


    let resizing =
        false;


    resizeHandle.addEventListener(
        "mousedown",
        function(event) {

            event.preventDefault();


            resizing =
                true;


            document.body.style.cursor =
                "col-resize";


            document.body.style.userSelect =
                "none";

        }
    );


    document.addEventListener(
        "mousemove",
        function(event) {

            if (!resizing) {

                return;

            }


            let width =
                event.clientX;


            if (
                width < 260
            ) {

                width =
                    260;

            }


            if (
                width > 520
            ) {

                width =
                    520;

            }


            sidebar.style.width =
                `${width}px`;


            map.style.left =
                `${width}px`;


            map.invalidateSize();

        }
    );


    document.addEventListener(
        "mouseup",
        function() {

            if (!resizing) {

                return;

            }


            resizing =
                false;


            document.body.style.cursor =
                "";


            document.body.style.userSelect =
                "";


            map.invalidateSize();

        }
    );


    /* ======================================================
       MODAL OUTSIDE CLICK
    ====================================================== */

    document
        .getElementById(
            "attributeModal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    this
                ) {

                    cancelDrawing();

                }

            }
        );


    /* ======================================================
       INITIALIZE
    ====================================================== */

    loadLocalData();

    renderFeatures();

</script>


</body>
</html>
